[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-plm"
version = "0.1.0"
description = "Cadence PLM – BOM maliyet analizi ve ECO yönetimi platformu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "openai>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath       = ["."]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# mypy  (strict tip kontrolü)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version      = "3.11"
strict              = true
ignore_missing_imports = true
